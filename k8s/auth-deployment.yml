apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth-deployment
  labels:
    name:  auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - image:  auth
        name:  auth-container
        resources:
          requests:
            cpu: "250m"
            memory: "128M"
          limits:
            cpu: "500m"
            memory: "256M"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/readyz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10

        env:
        - name: AUTH_MONGO_URI
          valueFrom: 
            secretKeyRef:
              key: AUTH
              name:  database      

        - name: GOOGLE_CLIENT_ID
          valueFrom: 
            secretKeyRef:
              key: GOOGLE_CLIENT_ID
              name:  google

        - name: GOOGLE_CLIENT_SECRET
          valueFrom: 
            secretKeyRef:
              key: GOOGLE_CLIENT_SECRET
              name:  google
        - name: JWT_SECRET
          valueFrom: 
            secretKeyRef:
              key: JWT_SECRET
              name:  jwt
        ports:
        - containerPort:  3000
          name:  auth-http
    